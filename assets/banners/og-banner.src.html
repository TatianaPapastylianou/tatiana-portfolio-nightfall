<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=zodiak@400,401,700&f[]=general-sans@400,500,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #ede4d2;
        --paper-2: #e6dcc6;
        --ink: #211913;
        --head: #1c140e;
        --body: #4e4234;
        --dim: #8c7e69;
        --gold-deep: #7e611f;
        --gold: #c8a24b;
        --serif: 'Zodiak', Georgia, serif;
        --sans: 'General Sans', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background:
          radial-gradient(60% 90% at 86% 50%, rgba(201, 162, 75, 0.16), transparent 70%),
          var(--paper);
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        align-items: center;
        gap: 40px;
        padding: 72px 80px;
        font-family: var(--sans);
      }
      .kicker {
        font-size: 17px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--dim);
        margin-bottom: 20px;
      }
      .name {
        font-family: var(--serif);
        font-size: 76px;
        line-height: 0.96;
        letter-spacing: -0.015em;
        color: var(--head);
      }
      .facts {
        margin-top: 30px;
        font-size: 21px;
        line-height: 1.5;
        color: var(--body);
        max-width: 34ch;
      }
      .manifesto {
        margin-top: 34px;
        font-family: var(--serif);
        font-style: italic;
        font-size: 24px;
        color: var(--head);
      }
      .manifesto b { color: var(--gold-deep); font-weight: 400; }
      .rule {
        width: 46px; height: 2px; background: var(--gold-deep); opacity: 0.6;
        margin-top: 30px;
      }
      .art { position: relative; justify-self: center; width: 100%; max-width: 420px; }
      .art .fr { width: 100%; display: block; filter: drop-shadow(0 26px 30px rgba(60,40,10,0.3)); position: relative; z-index: 2; }
      .art .win {
        position: absolute; left: 21.96%; top: 25.65%; width: 55.99%; height: 48.71%;
        overflow: hidden; z-index: 1; background: #fff; display: flex; align-items: center; justify-content: center;
      }
      .art .win img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    </style>
  </head>
  <body>
    <div class="copy">
      <p class="kicker">Senior Product Designer</p>
      <h1 class="name">Tatiana<br />Papastylianou</h1>
      <p class="facts">
        Design systems across web · iOS · Android. A live global learning product.
        Three App Store apps and a published book.
      </p>
      <p class="manifesto">A portfolio sells <b>judgement</b>, not screens.</p>
      <div class="rule"></div>
    </div>
    <div class="art">
      <div class="win"><img src="/cases/math-final-lesson.jpg" alt="" /></div>
      <img class="fr" src="/frames/frame-cut-web-landscape.webp" alt="" />
    </div>
  </body>
</html>
