<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1430" font-family="'Poppins','Trebuchet MS','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="glow" cx="12%" cy="88%" r="70%">
      <stop offset="0%" stop-color="#1f3a2c"/>
      <stop offset="100%" stop-color="#14181a"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1430" fill="url(#glow)"/>
  <!-- brand: ascending "steps" mark + kicker -->
  <g transform="translate(95,118)">
    <rect x="0" y="34" width="22" height="22" rx="6" fill="#5f6b66"/>
    <rect x="30" y="20" width="22" height="22" rx="6" fill="#7fbf98"/>
    <rect x="60" y="6" width="22" height="22" rx="6" fill="#8fd6a8"/>
    <rect x="90" y="-8" width="22" height="22" rx="6" fill="#8fd6a8"/>
    <text x="132" y="34" font-size="34" font-weight="600" fill="#8a938f" letter-spacing="6">STEPLAN · FOR FREELANCERS</text>
  </g>
  <!-- headline -->
  <g font-weight="800" letter-spacing="-3">
    <text x="88" y="430" font-size="132" fill="#f2f4f3">Every project.</text>
    <text x="88" y="568" font-size="132" fill="#8fd6a8">In steps.</text>
  </g>
  <!-- subtitle -->
  <g fill="#9aa3a1" font-size="45" font-weight="500">
    <text x="90" y="690">Projects, phases and checklists that</text>
    <text x="90" y="752">feel as light as Reminders — finally</text>
    <text x="90" y="814">in order.</text>
  </g>
  <!-- on-track stat card -->
  <g transform="translate(90,930)">
    <rect width="820" height="360" rx="30" fill="#8fd6a8"/>
    <text x="55" y="95" font-size="36" font-weight="700" fill="#173a2a" letter-spacing="5">ON TRACK</text>
    <text x="52" y="235" font-size="150" font-weight="800" fill="#14251c" letter-spacing="-3">78%</text>
    <text x="55" y="300" font-size="42" font-weight="500" fill="#245139">of steps done this week</text>
  </g>
</svg>
