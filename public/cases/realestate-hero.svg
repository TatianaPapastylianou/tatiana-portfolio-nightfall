<title id="reh-t">23 apps and services consolidated into 4 products</title>
<desc id="reh-d">Twenty-three small tiles on the left converge into four products on the right: Customer Management, Maintenance, My Pages and Investment. Two tiles are crossed out as decommissioned.</desc>
