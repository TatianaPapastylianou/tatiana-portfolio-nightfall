<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="aip-t aip-d" class="re-drawing">
<title id="aip-t">How one Android screen review runs</title>
<desc id="aip-d">Four sources go in: the live app captured at compact, medium and expanded sizes, the Figma design, the component library and the Android code. Each part is compared at component level, and the skill decides whether the fix belongs in the screen, the code component or the library. Three outputs come out: a review page in Figma with live and designed images at all sizes, Jira tickets grouped by component and sorted by priority, and a CSV for Jira import. Developers fix the tickets, and new rules learned during a review are written back into the skill.</desc>
<style>
.aip-k{fill:var(--dim, #8c7e69);font-family:var(--sans, 'Helvetica Neue', Arial, sans-serif);font-size:11px;font-weight:600;letter-spacing:.14em}
.aip-kg{fill:var(--gold-deep, #7e611f);font-family:var(--sans, 'Helvetica Neue', Arial, sans-serif);font-size:11px;font-weight:600;letter-spacing:.14em}
.aip-h{fill:var(--head, #1c140e);font-family:var(--serif, Georgia, 'Times New Roman', serif);font-size:19px}
.aip-num{fill:var(--head, #1c140e);font-family:var(--serif, Georgia, 'Times New Roman', serif);font-size:120px}
.aip-s{fill:var(--body, #4e4234);font-family:var(--sans, 'Helvetica Neue', Arial, sans-serif);font-size:12.5px}
.aip-sd{fill:var(--dim, #8c7e69);font-family:var(--sans, 'Helvetica Neue', Arial, sans-serif);font-size:12px}
.aip-sb{fill:var(--head, #1c140e);font-family:var(--sans, 'Helvetica Neue', Arial, sans-serif);font-size:13px;font-weight:600}
.aip-box{fill:var(--card, #f6f0e2);stroke:var(--ink, #211913);stroke-width:1.2}
.aip-boxs{fill:var(--card, #f6f0e2);stroke:var(--ink, #211913);stroke-width:1.8}
.aip-boxg{fill:var(--card, #f6f0e2);stroke:var(--gold-deep, #7e611f);stroke-width:1.6}
.aip-band{fill:var(--paper-2, #e6dcc6);stroke:var(--line-strong, rgba(60,44,24,.28));stroke-width:1}
.aip-ln{fill:none;stroke:var(--ink, #211913);stroke-width:1.5}
.aip-lngd{fill:none;stroke:var(--gold-deep, #7e611f);stroke-width:1.6;stroke-dasharray:4 5}
.aip-ah{fill:var(--ink, #211913)}
.aip-ahg{fill:var(--gold-deep, #7e611f)}
.aip-chip{fill:var(--paper-2, #e6dcc6);stroke:var(--ink, #211913);stroke-width:1}
</style>
<defs>
<marker id="aip-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aip-ah" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="aip-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aip-ahg" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="aip-k" x="40" y="46" text-anchor="start">IN · 4 SOURCES</text>
<text class="aip-k" x="380" y="46" text-anchor="start">COMPARE</text>
<text class="aip-k" x="700" y="46" text-anchor="start">OUT · READY FOR DEVELOPERS</text>
<rect class="aip-box" x="40" y="66" width="250" height="86" rx="6"/>
<text class="aip-sb" x="58" y="94" text-anchor="start">Live app</text>
<text class="aip-s" x="58" y="116" text-anchor="start">captured at 3 sizes,</text>
<text class="aip-s" x="58" y="134" text-anchor="start">compact, medium, expanded</text>
<path class="aip-ln" d="M292,109 C330,109 340,250 378,250" marker-end="url(#aip-a)"/>
<rect class="aip-box" x="40" y="170" width="250" height="86" rx="6"/>
<text class="aip-sb" x="58" y="198" text-anchor="start">Figma design</text>
<text class="aip-s" x="58" y="220" text-anchor="start">every instance, text style</text>
<text class="aip-s" x="58" y="238" text-anchor="start">and auto layout rule</text>
<path class="aip-ln" d="M292,213 C330,213 340,250 378,250" marker-end="url(#aip-a)"/>
