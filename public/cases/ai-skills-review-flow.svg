<text class="aip-sb" x="58" y="302" text-anchor="start">Component library</text>
<text class="aip-s" x="58" y="324" text-anchor="start">variants, tokens</text>
<text class="aip-s" x="58" y="342" text-anchor="start">and text styles</text>
<path class="aip-ln" d="M292,317 C330,317 340,250 378,250" marker-end="url(#aip-a)"/>
<rect class="aip-box" x="40" y="378" width="250" height="86" rx="6"/>
<text class="aip-sb" x="58" y="406" text-anchor="start">Android code</text>
<text class="aip-s" x="58" y="428" text-anchor="start">components, tokens,</text>
<text class="aip-s" x="58" y="446" text-anchor="start">size class logic</text>
<path class="aip-ln" d="M292,421 C330,421 340,250 378,250" marker-end="url(#aip-a)"/>
<rect class="aip-boxs" x="380" y="150" width="280" height="200" rx="8"/>
<text class="aip-h" x="400" y="186" text-anchor="start">Per component,</text>
<text class="aip-h" x="400" y="210" text-anchor="start">not per screen</text>
<text class="aip-sb" x="400" y="244" text-anchor="start">Where does the fix belong?</text>
<text class="aip-s" x="400" y="284" text-anchor="start">1  the screen</text>
<text class="aip-s" x="400" y="304" text-anchor="start">2  the code component</text>
<text class="aip-s" x="400" y="324" text-anchor="start">3  the library</text>
<rect class="aip-box" x="700" y="86" width="260" height="90" rx="6"/>
<text class="aip-sb" x="718" y="114" text-anchor="start">Figma review page</text>
<text class="aip-s" x="718" y="136" text-anchor="start">live vs designed at each size,</text>
<text class="aip-s" x="718" y="154" text-anchor="start">spacing bands in both directions</text>
<path class="aip-ln" d="M662,250 C690,250 680,131 698,131" marker-end="url(#aip-a)"/>
<rect class="aip-box" x="700" y="196" width="260" height="90" rx="6"/>
<text class="aip-sb" x="718" y="224" text-anchor="start">Jira tickets</text>
<text class="aip-s" x="718" y="246" text-anchor="start">grouped by component, with value,</text>
<text class="aip-s" x="718" y="264" text-anchor="start">measured value and done-when</text>
<path class="aip-ln" d="M662,250 C690,250 680,241 698,241" marker-end="url(#aip-a)"/>
<rect class="aip-box" x="700" y="306" width="260" height="90" rx="6"/>
<text class="aip-sb" x="718" y="334" text-anchor="start">CSV for Jira</text>
<text class="aip-s" x="718" y="356" text-anchor="start">one import, matches</text>
<text class="aip-s" x="718" y="374" text-anchor="start">the tickets in Figma</text>
<path class="aip-ln" d="M662,250 C690,250 680,351 698,351" marker-end="url(#aip-a)"/>
<rect class="aip-band" x="40" y="500" width="920" height="64" rx="8"/>
<text class="aip-sb" x="60" y="528" text-anchor="start">Languages page</text>
<text class="aip-s" x="60" y="548" text-anchor="start">26 changes in 6 component groups became 9 tickets</text>
<text class="aip-sb" x="520" y="528" text-anchor="start">Back into the skill</text>
<text class="aip-s" x="520" y="548" text-anchor="start">Developers fix, and each new rule becomes a skill lesson</text>
<path class="aip-lngd" d="M830,420 C830,470 700,470 700,498"/>
<path class="aip-lngd" d="M600,498 C600,440 580,420 580,356" marker-end="url(#aip-ag)"/>
</svg>