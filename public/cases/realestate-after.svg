.rea-on{fill:var(--card, #f6f0e2);font-family:var(--sans, 'Helvetica Neue', Arial, sans-serif);font-size:12px;font-weight:600}
.rea-box{fill:var(--card, #f6f0e2);stroke:var(--ink, #211913);stroke-width:1.2}
.rea-boxs{fill:var(--card, #f6f0e2);stroke:var(--ink, #211913);stroke-width:1.8}
.rea-boxg{fill:var(--card, #f6f0e2);stroke:var(--gold-deep, #7e611f);stroke-width:1.6}
.rea-boxd{fill:none;stroke:var(--dim, #8c7e69);stroke-width:1.2;stroke-dasharray:4 4}
.rea-boxsep{fill:var(--paper-2, #e6dcc6);stroke:var(--dim, #8c7e69);stroke-width:1.2}
.rea-band{fill:var(--paper-2, #e6dcc6);stroke:var(--line-strong, rgba(60,44,24,.28));stroke-width:1}
.rea-fill{fill:var(--ink, #211913)}
.rea-dot{fill:var(--card, #f6f0e2);stroke:var(--ink, #211913);stroke-width:1.8}
.rea-dotg{fill:var(--gold-lite, #e6c878);stroke:var(--gold-deep, #7e611f);stroke-width:1.8}
.rea-ln{fill:none;stroke:var(--ink, #211913);stroke-width:1.5}
.rea-lnf{fill:none;stroke:var(--line-strong, rgba(60,44,24,.28));stroke-width:1}
.rea-lng{fill:none;stroke:var(--gold-deep, #7e611f);stroke-width:2}
.rea-lngd{fill:none;stroke:var(--gold-deep, #7e611f);stroke-width:1.6;stroke-dasharray:4 5}
.rea-wire{fill:none;stroke:var(--ink, #211913);stroke-width:1.1;stroke-dasharray:3 4;opacity:.55}
.rea-wired{fill:var(--ink, #211913);opacity:.55}
.rea-ah{fill:var(--ink, #211913)}
.rea-ahg{fill:var(--gold-deep, #7e611f)}
.rea-x{fill:none;stroke:var(--gold-deep, #7e611f);stroke-width:1.6}
</style>
