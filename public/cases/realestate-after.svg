<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" role="img" aria-labelledby="rea-t rea-d" class="re-drawing">
<title id="rea-t">After: 4 products along one tenancy</title>
<desc id="rea-d">A tenancy timeline runs Invest, Let, Manage, Maintain, Live in it. Under it sit four products: Investment for the investment team (transactions, valuation); Customer Management for letting and property managers, with one role switch, covering letting, tenant administration, inspection (merged in), inventory, cases and tasks, building and tenant emails (was Message Dispatcher) and contracts (was Document Generator); Maintenance for technicians; and My Pages for tenants, whose requests go straight to the technician. User Service is the shared user backend. Outside the four: Staff stays a separate tool for managers, Dictionary Service now translates the websites, and Energy and Smart Buildings were decommissioned.</desc>
<style>
.rea-k{fill:var(--dim, #8c7e69);font-family:var(--sans, 'Helvetica Neue', Arial, sans-serif);font-size:11px;font-weight:600;letter-spacing:.14em}
.rea-kg{fill:var(--gold-deep, #7e611f);font-family:var(--sans, 'Helvetica Neue', Arial, sans-serif);font-size:11px;font-weight:600;letter-spacing:.14em}
