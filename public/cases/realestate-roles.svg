.rer-on{fill:var(--card, #f6f0e2);font-family:var(--sans, 'Helvetica Neue', Arial, sans-serif);font-size:12px;font-weight:600}
.rer-box{fill:var(--card, #f6f0e2);stroke:var(--ink, #211913);stroke-width:1.2}
.rer-boxs{fill:var(--card, #f6f0e2);stroke:var(--ink, #211913);stroke-width:1.8}
.rer-boxg{fill:var(--card, #f6f0e2);stroke:var(--gold-deep, #7e611f);stroke-width:1.6}
.rer-boxd{fill:none;stroke:var(--dim, #8c7e69);stroke-width:1.2;stroke-dasharray:4 4}
.rer-boxsep{fill:var(--paper-2, #e6dcc6);stroke:var(--dim, #8c7e69);stroke-width:1.2}
.rer-band{fill:var(--paper-2, #e6dcc6);stroke:var(--line-strong, rgba(60,44,24,.28));stroke-width:1}
.rer-fill{fill:var(--ink, #211913)}
.rer-dot{fill:var(--card, #f6f0e2);stroke:var(--ink, #211913);stroke-width:1.8}
.rer-dotg{fill:var(--gold-lite, #e6c878);stroke:var(--gold-deep, #7e611f);stroke-width:1.8}
.rer-ln{fill:none;stroke:var(--ink, #211913);stroke-width:1.5}
.rer-lnf{fill:none;stroke:var(--line-strong, rgba(60,44,24,.28));stroke-width:1}
.rer-lng{fill:none;stroke:var(--gold-deep, #7e611f);stroke-width:2}
.rer-lngd{fill:none;stroke:var(--gold-deep, #7e611f);stroke-width:1.6;stroke-dasharray:4 5}
.rer-wire{fill:none;stroke:var(--ink, #211913);stroke-width:1.1;stroke-dasharray:3 4;opacity:.55}
.rer-wired{fill:var(--ink, #211913);opacity:.55}
.rer-ah{fill:var(--ink, #211913)}
.rer-ahg{fill:var(--gold-deep, #7e611f)}
.rer-x{fill:none;stroke:var(--gold-deep, #7e611f);stroke-width:1.6}
</style>
