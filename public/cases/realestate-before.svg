<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 630" width="1090" height="630" role="img" aria-labelledby="reb-t reb-d" class="re-drawing">
<title id="reb-t">Before: 23 apps and services grouped by tenancy stage</title>
<desc id="reb-d">Six columns. Invest: Investment, Transaction, Approval. Let: Lettings, Offer, Tenant Administration, Rent. Manage: Customer Management, Inspection, Inventory, Energy, Smart Buildings, Compliance, Litigation. Maintain: Work Order, Order, Supplier. Tenant: My Pages. Admin and tools: Staff, User Service, Dictionary Service, Message Dispatcher, Document Generator. Dashed lines cross between them: data was copied from app to app instead of shared. A property manager needed 8 apps to finish one tenancy.</desc>
